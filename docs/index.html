<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIDI Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --panel:#34322f;        /* anodized panel */
    --recess:#211f1d;       /* inset screen well */
    --edge:#4a4741;
    --silk:#e9e5dc;         /* silkscreen legend */
    --silk-dim:#9b968c;
    --signal:#e0a33a;       /* backlight amber */
    --hot:#e7168a;          /* stripe red-orange */
    --cool:#26a9e1;         /* stripe blue */
    --key:#efece3;
    --key-edge:#c2bdb0;
    --sharp:#26241f;
    --sans:"Saira Condensed","Haettenschweiler","Arial Narrow",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Menlo,monospace;
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; padding:28px 20px 56px;
    background:#171614;
    color:var(--silk);
    font:400 15px/1.5 var(--sans);
    letter-spacing:.01em;
  }
  .unit{max-width:880px;margin:0 auto}

  /* ---- panel construction ---- */
  .panel{
    background:var(--panel);
    border:1px solid var(--edge);
    border-radius:3px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.07), 0 2px 0 #0d0c0b, 0 14px 34px rgba(0,0,0,.45);
  }
  .bay{padding:10px 20px}
  .bay + .bay{border-top:1px solid #262421;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}

  /* ---- header ---- */
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .badge{
    flex:0 0 auto;
    height:100px;width:auto;max-width:170px;
    object-fit:contain;
    display:block;
  }
  h1{
    font:600 27px/1 var(--sans);
    margin:0; letter-spacing:.005em;
    flex:1 1 200px;
  }
  h1 small{display:block;font:400 13px/1.35 var(--sans);color:var(--silk-dim);margin-top:4px}
  .lamp{
    flex:0 0 auto;display:flex;align-items:center;gap:8px;
    font:400 13px/1 var(--sans);color:var(--silk-dim);
  }
  .lamp b{
    width:9px;height:9px;border-radius:50%;
    background:#3b3833;box-shadow:inset 0 0 0 1px #191816;
    transition:background .12s linear, box-shadow .12s linear;
  }
  .lamp.live b{background:var(--signal);box-shadow:0 0 9px 1px rgba(224,163,58,.6)}
  .lamp.fault b{background:var(--hot);box-shadow:0 0 9px 1px rgba(217,79,43,.5)}

  /* ---- controls ---- */
  .row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .field{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--silk-dim)}
  select,button{font-family:var(--sans);font-size:14.5px}
  select{
    background:var(--recess);color:var(--silk);
    border:1px solid #14130f;border-radius:2px;
    padding:6px 9px;max-width:min(300px,60vw);
    box-shadow:inset 0 1px 2px rgba(0,0,0,.5);
  }
  button{
    background:linear-gradient(#4a4741,#3b3833);
    color:var(--silk);border:1px solid #201f1c;border-radius:2px;
    padding:8px 15px;cursor:pointer;font-weight:500;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.1), 0 1px 0 #16150f;
  }
  button:hover{background:linear-gradient(#524e47,#403d38)}
  button:active{background:#332f2b;box-shadow:inset 0 2px 3px rgba(0,0,0,.5)}
  button.primary{background:linear-gradient(#65318d,#7b1ec2);border-color:#3a0f5c;color:#fff8f2}
  button.primary:hover{background:linear-gradient(#8f47c7,#9a27f1)}
  :focus-visible{outline:2px solid var(--signal);outline-offset:2px}
  label.check{display:inline-flex;align-items:center;gap:7px;cursor:pointer;color:var(--silk-dim);font-size:14px}
  input[type=checkbox]{accent-color:var(--hot);width:15px;height:15px;margin:0}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:96px;height:9px;margin:0;
    background:var(--recess);border-radius:2px;
    box-shadow:inset 0 1px 2px rgba(0,0,0,.6);cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:11px;height:19px;border-radius:2px;
    background:linear-gradient(#e9e5dc,#b8b3a6);border:1px solid #14130f;
  }
  input[type=range]::-moz-range-thumb{
    width:11px;height:19px;border-radius:2px;
    background:linear-gradient(#e9e5dc,#b8b3a6);border:1px solid #14130f;
  }

  /* ---- messages to the operator ---- */
  .notice{
    margin:14px 0 0;padding:12px 14px;
    background:var(--recess);border-left:3px solid var(--signal);border-radius:2px;
    font-size:14.5px;line-height:1.55;color:#cfcabf;max-width:70ch;
  }
  .notice.fault{border-left-color:var(--hot)}
  .notice p{margin:0 0 7px}
  .notice p:last-child{margin:0}
  .notice code{font:400 13px var(--mono);color:var(--signal)}
  [hidden]{display:none !important}

  /* ---- keyboard ---- */
  .board-wrap{display:flex;align-items:stretch;gap:10px}
  .oob{
    flex:0 0 12px;align-self:center;text-align:center;
    color:#413e39;font-size:15px;line-height:1;transition:color .1s linear;
  }
  .oob.hit{color:var(--hot)}
  .board{
    position:relative;flex:1 1 auto;height:118px;touch-action:none;
    background:var(--recess);border-radius:2px;padding:6px;
    box-shadow:inset 0 2px 5px rgba(0,0,0,.6);
    overflow:hidden;
  }
  .whites{position:absolute;inset:6px;display:flex}
  .w{
    flex:1 1 0;min-width:0;height:100%;cursor:pointer;
    background:linear-gradient(#f4f1e8,#ddd9cd);
    border-right:1px solid var(--key-edge);border-radius:0 0 2px 2px;
  }
  .w:last-child{border-right:none}
  .sharps{position:absolute;inset:6px;pointer-events:none}
  .b{
    position:absolute;top:0;height:62%;pointer-events:auto;cursor:pointer;
    background:linear-gradient(#3a3731,#1e1c18);
    border-radius:0 0 2px 2px;box-shadow:0 2px 3px rgba(0,0,0,.5);
  }
  .w.on{background:linear-gradient(rgb(124, 216, 255),var(--cool));box-shadow:inset 0 0 8px rgba(38, 169, 225,.35)}
  .b.on{background:linear-gradient(#65318d,#4e0188)}
  .marker{
    position:absolute;bottom:3px;left:0;right:0;text-align:center;
    font:400 10px/1 var(--sans);color:#949fa8;pointer-events:none;
  }

  /* ---- readout ---- */
  .readout{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin-top:14px}
  .stat{display:flex;flex-direction:column;gap:3px}
  .stat span{font-size:12.5px;color:var(--silk-dim);letter-spacing:.02em}
  .stat strong{font:500 20px/1 var(--mono);color:var(--silk);min-height:20px}
  .meter{
    flex:1 1 130px;max-width:230px;height:9px;
    background:var(--recess);border-radius:2px;overflow:hidden;
    box-shadow:inset 0 1px 2px rgba(0,0,0,.6);
  }
  .meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--signal),var(--hot));transition:width .05s linear}

  /* ---- log ---- */
  .log-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:12px}
  .log-head h2{font:500 17px/1 var(--sans);margin:0}
  .tally{font:400 13px var(--mono);color:var(--silk-dim)}
  .stream{
    background:var(--recess);border-radius:2px;
    box-shadow:inset 0 2px 5px rgba(0,0,0,.6);
    height:330px;overflow-y:auto;overflow-x:hidden;
    font:400 12.5px/1.55 var(--mono);
  }
  .stream table{width:100%;border-collapse:collapse;table-layout:fixed}
  .stream th{
    position:sticky;top:0;z-index:1;
    background:#191713;color:var(--silk-dim);
    font:400 11.5px/1 var(--sans);letter-spacing:.03em;
    text-align:left;padding:7px 8px;border-bottom:1px solid #0e0d0b;
  }
  .stream td{padding:2px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#c8c3b7}
  .stream tr:nth-child(even) td{background:rgba(255,255,255,.022)}
  .c-t{width:9%}.c-p{width:19%}.c-c{width:7%}.c-m{width:26%}.c-v{width:23%}.c-h{width:16%}
  td.c-t{color:#7e796e}
  td.c-m{color:var(--silk)}
  td.c-v{color:var(--cool)}
  td.c-h{color:#7e796e}
  tr.sys td.c-m{color:var(--cool)}
  tr.out td.c-m{color:var(--hot)}
  tr.out td.c-p{color:var(--hot)}
  .empty{padding:20px;color:var(--silk-dim);font:400 14px var(--sans)}

  footer{max-width:880px;margin:16px auto 0;color:#6d685e;font-size:13.5px;line-height:1.6}
  footer a{color:#8f8a7e}

  @media (max-width:620px){
    body{padding:16px 12px 40px}
    .c-p,.c-h{display:none}
    .c-t{width:14%}.c-c{width:11%}.c-m{width:40%}.c-v{width:35%}
    .board{height:92px}
    h1{font-size:23px}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none !important}
  }
</style>
</head>
<body>

<div class="unit">
  <div class="panel">

    <div class="bay">
      <header>
        <img class="badge" src="logo.png" alt="">
        <h1>MIDI Monitor</h1>
        <div class="lamp" id="lamp"><b></b><em id="lampText" style="font-style:normal">Not listening</em></div>
      </header>

      <div class="row" style="margin-top:16px">
        <button class="primary" id="enable">Connect a MIDI device</button>
        <label class="check" id="sysexWrap">
          <input type="checkbox" id="sysex">
          Include SysEx messages
        </label>
        <div class="field" id="portWrap" hidden>
          <label for="port">Input</label>
          <select id="port"><option value="all">All inputs</option></select>
        </div>
        <div class="field" id="outWrap" hidden>
          <label for="out">Output</label>
          <select id="out"><option value="none">Nothing</option></select>
        </div>
        <label class="check"><input type="checkbox" id="audio" checked> Play notes</label>
        <div class="field" id="volWrap" hidden>
          <label for="vol">Volume</label>
          <input type="range" id="vol" min="0" max="100" value="70" aria-label="Volume">
        </div>
      </div>

      <div class="notice" id="notice" hidden></div>
    </div>

    <div class="bay">
      <div class="board-wrap">
        <div class="oob" id="oobLow" title="Notes below C2 arrived">◂</div>
        <div class="board">
          <div class="whites" id="whites"></div>
          <div class="sharps" id="sharps"></div>
        </div>
        <div class="oob" id="oobHigh" title="Notes above C7 arrived">▸</div>
      </div>

      <div class="readout">
        <div class="stat"><span>Last note</span><strong id="rNote">—</strong></div>
        <div class="stat"><span>Velocity</span><strong id="rVel">—</strong></div>
        <div class="stat"><span>Channel</span><strong id="rCh">—</strong></div>
        <div class="stat"><span>Held</span><strong id="rHeld">0</strong></div>
        <div class="meter" aria-hidden="true"><i id="rMeter"></i></div>
      </div>
    </div>

    <div class="bay">
      <div class="log-head">
        <h2>Message stream</h2>
        <div class="row">
          <label class="check"><input type="checkbox" id="fClock" checked> Hide clock</label>
          <label class="check"><input type="checkbox" id="fSense" checked> Hide active sensing</label>
          <button id="clear">Clear stream</button>
        </div>
      </div>
      <div class="stream" id="stream">
        <table>
          <thead><tr>
            <th class="c-t">Time</th><th class="c-p">Input</th><th class="c-c">Ch</th>
            <th class="c-m">Message</th><th class="c-v">Value</th><th class="c-h">Bytes</th>
          </tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="empty" id="empty">Nothing yet.</div>
      </div>
      <div class="tally" style="margin-top:10px"><span id="tally">0 messages received</span></div>
    </div>

  </div>
</div>

<script>
(() => {
  "use strict";

  // ---------- element refs ----------
  const $ = id => document.getElementById(id);
  const els = {
    enable:$("enable"), sysex:$("sysex"), sysexWrap:$("sysexWrap"),
    portWrap:$("portWrap"), port:$("port"), notice:$("notice"),
    lamp:$("lamp"), lampText:$("lampText"),
    whites:$("whites"), sharps:$("sharps"), oobLow:$("oobLow"), oobHigh:$("oobHigh"),
    rNote:$("rNote"), rVel:$("rVel"), rCh:$("rCh"), rHeld:$("rHeld"), rMeter:$("rMeter"),
    rows:$("rows"), empty:$("empty"), tally:$("tally"), clear:$("clear"),
    fClock:$("fClock"), fSense:$("fSense"),
    audio:$("audio"), vol:$("vol"), volWrap:$("volWrap"),
    out:$("out"), outWrap:$("outWrap")
  };

  // ---------- constants ----------
  const LOW = 36, HIGH = 96;            // C2..C7, the drawn range
  const MAX_ROWS = 400;
  const NOTE_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
  const IS_FIREFOX = /firefox/i.test(navigator.userAgent);

  const CC_NAMES = {
    0:"Bank select", 1:"Mod wheel", 2:"Breath", 4:"Foot pedal", 5:"Portamento time",
    6:"Data entry", 7:"Volume", 8:"Balance", 10:"Pan", 11:"Expression",
    64:"Sustain pedal", 65:"Portamento", 66:"Sostenuto", 67:"Soft pedal",
    71:"Resonance", 74:"Cutoff", 91:"Reverb", 93:"Chorus",
    120:"All sound off", 121:"Reset controllers", 122:"Local control",
    123:"All notes off", 124:"Omni off", 125:"Omni on", 126:"Mono mode", 127:"Poly mode"
  };
  const SYSTEM = {
    0xF1:"MTC quarter frame", 0xF2:"Song position", 0xF3:"Song select",
    0xF6:"Tune request", 0xF7:"End of SysEx", 0xF8:"Timing clock",
    0xFA:"Start", 0xFB:"Continue", 0xFC:"Stop", 0xFE:"Active sensing", 0xFF:"System reset"
  };

  // ---------- state ----------
  let access = null;
  let t0 = 0;
  let total = 0;
  let pending = [];
  let frameQueued = false;
  let lampTimer = null;
  const held = new Set();
  const bound = new WeakSet();
  const keyEls = new Map();             // note number -> element

  // ---------- keyboard construction ----------
  const isSharp = n => [1,3,6,8,10].includes(n % 12);

  function buildKeyboard(){
    const whites = [];
    for (let n = LOW; n <= HIGH; n++) if (!isSharp(n)) whites.push(n);
    const w = 100 / whites.length;

    whites.forEach((n, i) => {
      const el = document.createElement("div");
      el.className = "w";
      el.dataset.note = n;
      if (n % 12 === 0) {                                  // label each C
        const m = document.createElement("span");
        m.className = "marker";
        m.textContent = "C" + (Math.floor(n / 12) - 1);
        el.appendChild(m);
      }
      els.whites.appendChild(el);
      keyEls.set(n, el);
      // any sharp sitting to the right of this white key
      const s = n + 1;
      if (s <= HIGH && isSharp(s)) {
        const b = document.createElement("div");
        b.className = "b";
        b.dataset.note = s;
        b.style.left  = ((i + 1) * w - w * 0.29) + "%";
        b.style.width = (w * 0.58) + "%";
        els.sharps.appendChild(b);
        keyEls.set(s, b);
      }
    });
  }
  buildKeyboard();

  // ---------- synth ----------
  // voice graph: two oscillators -> lowpass -> gain envelope -> master.
  const Synth = (() => {
    const MAX_VOICES = 16;
    const BEND_RANGE = 2;               // semitones at full wheel travel
    let ctx = null, master = null, enabled = false, level = 0.7;
    let pedalDown = false, bendSemis = 0;
    const voices = new Map();           // note -> voice
    const waiting = new Set();          // notes released while the pedal is held

    function start(){
      if (ctx) { if (ctx.state === "suspended") ctx.resume(); return; }
      const AC = window.AudioContext || window.webkitAudioContext;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = level;
      // compressor keeps chords from clipping.
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -12;
      comp.ratio.value = 8;
      comp.attack.value = 0.004;
      comp.release.value = 0.2;
      master.connect(comp).connect(ctx.destination);
    }

    const hz = (note, semis) => 440 * Math.pow(2, (note - 69 + semis) / 12);

    function noteOn(note, vel){
      if (!enabled) return;
      start();
      if (voices.has(note)) release(note, 0.02);      // retrigger cleanly
      if (voices.size >= MAX_VOICES) release(voices.keys().next().value, 0.04);
      waiting.delete(note);

      const t = ctx.currentTime;
      const f = hz(note, bendSemis);
      const v = Math.pow(vel / 127, 1.6);
      const peak = 0.30 * v;

      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak, t + 0.006);          // attack
      g.gain.exponentialRampToValueAtTime(peak * 0.55, t + 0.45);    // decay to sustain

      const lp = ctx.createBiquadFilter();
      lp.type = "lowpass";
      lp.Q.value = 0.9;
      const open = Math.min(1200 + v * 5200, 11000);
      lp.frequency.setValueAtTime(open, t);
      lp.frequency.exponentialRampToValueAtTime(Math.max(open * 0.35, 320), t + 0.6);

      const o1 = ctx.createOscillator(); o1.type = "triangle"; o1.frequency.value = f;
      const o2 = ctx.createOscillator(); o2.type = "sawtooth"; o2.frequency.value = f; o2.detune.value = 6;
      const mix = ctx.createGain(); mix.gain.value = 0.3;

      o1.connect(lp);
      o2.connect(mix).connect(lp);
      lp.connect(g).connect(master);
      o1.start(t); o2.start(t);

      voices.set(note, { o1, o2, g, lp });
    }

    function release(note, time){
      const vc = voices.get(note);
      if (!vc) return;
      voices.delete(note);
      const t = ctx.currentTime, r = time ?? 0.28;
      vc.g.gain.cancelScheduledValues(t);
      vc.g.gain.setValueAtTime(Math.max(vc.g.gain.value, 0.0001), t);
      vc.g.gain.exponentialRampToValueAtTime(0.0001, t + r);
      vc.o1.stop(t + r + 0.02);
      vc.o2.stop(t + r + 0.02);
      vc.o1.onended = () => { try { vc.g.disconnect(); vc.lp.disconnect(); } catch (_) {} };
    }

    return {
      set(on){
        enabled = on;
        if (on) start(); else this.allOff();
      },
      volume(x){ level = x; if (master) master.gain.value = x; },
      noteOn,
      noteOff(note){
        if (!ctx) return;
        if (pedalDown) waiting.add(note); else release(note);
      },
      pedal(down){
        pedalDown = down;
        if (!down) { waiting.forEach(n => release(n)); waiting.clear(); }
      },
      bend(semis){
        bendSemis = semis * BEND_RANGE;
        if (!ctx) return;
        const t = ctx.currentTime;
        voices.forEach((vc, note) => {
          const f = hz(note, bendSemis);
          vc.o1.frequency.setTargetAtTime(f, t, 0.01);
          vc.o2.frequency.setTargetAtTime(f, t, 0.01);
        });
      },
      allOff(){
        if (!ctx) return;
        [...voices.keys()].forEach(n => release(n, 0.06));
        waiting.clear();
        pedalDown = false;
      }
    };
  })();

  // ---------- helpers ----------
  const noteName = n => NOTE_NAMES[n % 12] + (Math.floor(n / 12) - 1);
  const hex = bytes => Array.from(bytes, b => b.toString(16).toUpperCase().padStart(2, "0")).join(" ");
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

  function setLamp(state, text){
    els.lamp.classList.toggle("live", state === "live");
    els.lamp.classList.toggle("fault", state === "fault");
    els.lampText.textContent = text;
  }
  function blip(){
    els.lamp.classList.add("live");
    clearTimeout(lampTimer);
    lampTimer = setTimeout(() => els.lamp.classList.remove("live"), 90);
  }
  function say(html, fault){
    els.notice.innerHTML = html;
    els.notice.classList.toggle("fault", !!fault);
    els.notice.hidden = false;
  }

  function flashOob(note){
    const el = note < LOW ? els.oobLow : els.oobHigh;
    el.classList.add("hit");
    setTimeout(() => el.classList.remove("hit"), 220);
  }

  // ---------- message decoding ----------
  // Returns {name, value, sys}
  function decode(data){
    const status = data[0];

    if (status >= 0xF0) {
      if (status === 0xF0) return { name:"SysEx", value:data.length + " bytes", sys:true };
      if (status === 0xF2) return { name:SYSTEM[status], value:String((data[2] << 7) | data[1]), sys:true };
      if (status === 0xF1 || status === 0xF3) return { name:SYSTEM[status], value:String(data[1]), sys:true };
      return { name:SYSTEM[status] || "System 0x" + status.toString(16), value:"", sys:true };
    }

    const type = status & 0xF0, d1 = data[1], d2 = data[2];
    switch (type) {
      case 0x80: return { name:"Note off", value:noteName(d1) + " (" + d1 + ")  rel " + d2 };
      case 0x90: return d2 === 0
        ? { name:"Note off", value:noteName(d1) + " (" + d1 + ")  vel 0" }
        : { name:"Note on",  value:noteName(d1) + " (" + d1 + ")  vel " + d2 };
      case 0xA0: return { name:"Aftertouch", value:noteName(d1) + " (" + d1 + ")  " + d2 };
      case 0xB0: return { name:"Control " + d1, value:(CC_NAMES[d1] ? CC_NAMES[d1] + "  " : "") + d2 };
      case 0xC0: return { name:"Program change", value:String(d1) };
      case 0xD0: return { name:"Channel pressure", value:String(d1) };
      case 0xE0: return { name:"Pitch bend", value:String(((d2 << 7) | d1) - 8192) };
      default:   return { name:"Unknown", value:"" };
    }
  }

  function filtered(status){
    if (els.fSense.checked && status === 0xFE) return true;
    if (els.fClock.checked && (status === 0xF8 || status === 0xFA || status === 0xFB || status === 0xFC)) return true;
    return false;
  }

  // ---------- incoming messages ----------
  function onMessage(e){
    const data = e.data;
    const status = data[0];
    if (status < 0x80) return;                     // running status / junk

    const type = status & 0xF0;
    if (type === 0x90 && data[2] > 0)        noteOn(data[1], data[2], (status & 0x0F) + 1);
    else if (type === 0x80 || type === 0x90) noteOff(data[1]);
    else if (type === 0xB0) {
      if (data[1] === 64) Synth.pedal(data[2] >= 64);                      // sustain pedal
      else if (data[1] === 120 || data[1] === 123) panic();                // all sound / notes off
    }
    else if (type === 0xE0) Synth.bend((((data[2] << 7) | data[1]) - 8192) / 8192);

    total++;
    if (filtered(status)) return;

    blip();
    logMessage(data, e.target.name || e.target.id || "—", e.timeStamp, false);
  }

  // Both directions land here, so sent and received rows decode identically.
  function logMessage(data, portLabel, stamp, outgoing){
    const status = data[0];
    if (!t0) t0 = stamp;
    const d = decode(data);
    pending.push({
      t: ((stamp - t0) / 1000).toFixed(3),
      port: portLabel,
      ch: status < 0xF0 ? String((status & 0x0F) + 1) : "—",
      name: d.name,
      value: d.value,
      hex: data.length > 8 ? hex(data.slice(0, 8)) + " …" : hex(data),
      sys: !!d.sys,
      out: !!outgoing
    });

    if (!frameQueued) { frameQueued = true; requestAnimationFrame(flush); }
  }

  function flush(){
    frameQueued = false;
    if (!pending.length) return;

    els.empty.hidden = true;
    // Newest first
    const html = pending.reverse().map(r =>
      '<tr class="' + (r.sys ? 'sys ' : '') + (r.out ? 'out' : '') + '">' +
        '<td class="c-t">' + r.t + '</td>' +
        '<td class="c-p" title="' + esc(r.port) + '">' + esc(r.port) + '</td>' +
        '<td class="c-c">' + r.ch + '</td>' +
        '<td class="c-m">' + esc(r.name) + '</td>' +
        '<td class="c-v">' + esc(r.value) + '</td>' +
        '<td class="c-h">' + r.hex + '</td>' +
      '</tr>').join("");
    pending = [];

    els.rows.insertAdjacentHTML("afterbegin", html);
    while (els.rows.children.length > MAX_ROWS) els.rows.lastElementChild.remove();
    els.tally.textContent = total.toLocaleString() + (total === 1 ? " message" : " messages");
  }

  function noteOn(note, vel, ch){
    held.add(note);
    Synth.noteOn(note, vel);
    const el = keyEls.get(note);
    if (el) el.classList.add("on"); else flashOob(note);
    els.rNote.textContent = noteName(note) + "  " + note;
    els.rVel.textContent = vel;
    els.rCh.textContent = ch;
    els.rMeter.style.width = (vel / 127 * 100) + "%";
    els.rHeld.textContent = held.size;
  }

  function noteOff(note){
    held.delete(note);
    Synth.noteOff(note);
    const el = keyEls.get(note);
    if (el) el.classList.remove("on");
    els.rHeld.textContent = held.size;
    if (!held.size) els.rMeter.style.width = "0";
  }

  function panic(){
    Synth.allOff();
    touching.forEach(n => { if (n !== null) sendOut([0x80 | OUT_CH, n, 0]); });
    touching.clear();
    sendOut([0xB0 | OUT_CH, 123, 0]);        // All notes off
    held.forEach(n => keyEls.get(n)?.classList.remove("on"));
    held.clear();
    els.rHeld.textContent = "0";
    els.rMeter.style.width = "0";
  }

  // ---------- device wiring ----------
  function refreshPorts(){
    const chosen = els.port.value;
    els.port.innerHTML = '<option value="all">All inputs</option>';
    let count = 0;
    for (const input of access.inputs.values()) {
      count++;
      const o = document.createElement("option");
      o.value = input.id;
      o.textContent = input.name + (input.manufacturer ? " — " + input.manufacturer : "");
      els.port.appendChild(o);
      if (!bound.has(input)) { input.onmidimessage = handle; bound.add(input); }
    }
    if ([...els.port.options].some(o => o.value === chosen)) els.port.value = chosen;
    els.portWrap.hidden = false;

    const prevOut = els.out.value;
    els.out.innerHTML = '<option value="none">Nothing</option>';
    for (const output of access.outputs.values()) {
      const o = document.createElement("option");
      o.value = output.id;
      o.textContent = output.name + (output.manufacturer ? " — " + output.manufacturer : "");
      els.out.appendChild(o);
    }
    els.out.value = [...els.out.options].some(o => o.value === prevOut)
      ? prevOut
      : (els.out.options[1] ? els.out.options[1].value : "none");
    els.outWrap.hidden = false;

    if (!count) {
      say("<p>Connected, but no MIDI inputs are visible. Plug in your device.</p>");
      setLamp("idle", "No inputs found");
    } else {
      els.notice.hidden = true;
      setLamp("idle", count === 1 ? "1 input connected" : count + " inputs connected");
    }
  }

  // Port filtering lives here so switching inputs never needs a rebind.
  function handle(e){
    const sel = els.port.value;
    if (sel !== "all" && e.target.id !== sel) return;
    onMessage(e);
  }

  async function connect(){
    if (!navigator.requestMIDIAccess) {
      say("<p>This browser has no Web MIDI support." +
          "Use Chrome, Edge, or Firefox 108+, Safari is not supportted.</p>", true);
      setLamp("fault", "Unsupported browser");
      return;
    }

    els.enable.disabled = true;
    els.enable.textContent = "Requesting access…";

    try {
      access = await navigator.requestMIDIAccess({ sysex: els.sysex.checked });
      access.onstatechange = refreshPorts;

      els.enable.hidden = true;
      els.sysexWrap.hidden = true;
      refreshPorts();

    } catch (err) {
      els.enable.disabled = false;
      els.enable.textContent = "Connect a MIDI device";
      setLamp("fault", "Access denied");

      const addonGated = IS_FIREFOX || /add-on|addon/i.test(err.message || "");
      if (addonGated) {
        say("<p>Firefox gates Web MIDI behind a site permission add-on. When Firefox offers to " +
            "install it, accept both prompts, then reload this page.</p>" +
            "<p>If no prompt appeared, your MIDI device probably was not plugged in when Firefox " +
            "started. Firefox has no hot-plug detection: attach the device, restart Firefox, and " +
            "try again.</p>" +
            "<p><code>" + esc(err.name + ": " + err.message) + "</code></p>", true);
      } else if (err.name === "SecurityError" || err.name === "NotAllowedError") {
        say("<p>Access was blocked. Check the MIDI permission for this site in your browser " +
            "settings and try again. Note that Web MIDI also requires HTTPS or localhost.</p>", true);
      } else {
        say("<p>Could not open MIDI: <code>" + esc(err.name + ": " + err.message) + "</code></p>", true);
      }
    }
  }

  // ---------- playing out ----------
  const CLICK_VEL = 100;
  const OUT_CH = 0;                 // 0 = MIDI channel 1
  const board = document.querySelector(".board");
  const touching = new Map();       // pointerId -> note (or null when off-key)

  function sendOut(bytes){
    if (!access) return;
    const out = access.outputs.get(els.out.value);
    if (!out) return;                      // "Nothing" selected — local synth only
    // A disconnected port throws rather than failing quietly.
    try { out.send(bytes); } catch (_) { return; }
    total++;
    logMessage(bytes, "to " + (out.name || out.id), performance.now(), true);
  }

  function pressKey(note){
    const msg = [0x90 | OUT_CH, note, CLICK_VEL];
    sendOut(msg);
    logLocal(msg);
    noteOn(note, CLICK_VEL, OUT_CH + 1);
  }
  function releaseKey(note){
    const msg = [0x80 | OUT_CH, note, 0];
    sendOut(msg);
    logLocal(msg);
    noteOff(note);
  }

  function logLocal(bytes){
    if (access && access.outputs.get(els.out.value)) return;  // sendOut already logged it
    total++;
    logMessage(bytes, "on screen", performance.now(), true);
  }

  function noteAt(e){
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const n = el && el.dataset ? el.dataset.note : null;
    return n === undefined || n === null ? null : Number(n);
  }

  board.addEventListener("pointerdown", e => {
    const note = noteAt(e);
    if (note === null) return;
    e.preventDefault();
    board.setPointerCapture(e.pointerId);    // keeps pointerup ours even off-board
    touching.set(e.pointerId, note);
    pressKey(note);
  });

  board.addEventListener("pointermove", e => {
    if (!touching.has(e.pointerId)) return;
    const prev = touching.get(e.pointerId);
    const note = noteAt(e);
    if (note === prev) return;
    if (prev !== null) releaseKey(prev);
    touching.set(e.pointerId, note);
    if (note !== null) pressKey(note);
  });

  function lift(e){
    if (!touching.has(e.pointerId)) return;
    const note = touching.get(e.pointerId);
    touching.delete(e.pointerId);
    if (note !== null) releaseKey(note);
  }
  board.addEventListener("pointerup", lift);
  board.addEventListener("pointercancel", lift);

  // ---------- controls ----------
  function syncAudio(){
    Synth.set(els.audio.checked);
    els.volWrap.hidden = !els.audio.checked;
  }

  els.enable.addEventListener("click", () => {
    syncAudio();
    connect();
  });

  els.audio.addEventListener("change", syncAudio);
  els.vol.addEventListener("input", () => Synth.volume(els.vol.value / 100));

  syncAudio();   // apply whatever state the checkbox has in the markup

  window.addEventListener("keydown", e => { if (e.key === "Escape") panic(); });
  window.addEventListener("blur", panic);
  els.clear.addEventListener("click", () => {
    els.rows.innerHTML = "";
    total = 0; t0 = 0; pending = [];
    els.empty.hidden = false;
    els.tally.textContent = "0 messages received";
  });

  if (!navigator.requestMIDIAccess) {
    say("<p>This browser has no Web MIDI support. Try Chrome.</p>", true);
    els.enable.disabled = true;
    setLamp("fault", "Unsupported browser");
  } else if (!window.isSecureContext) {
    say("<p>Web MIDI only works in a secure context.</p>", true);
  }
})();
</script>
</body>
</html>
